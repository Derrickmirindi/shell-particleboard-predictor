<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shell Particleboard Property Predictor</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
--cols: 12;
--gutter: 24px;
--margin: 48px;
--bl: 8px;
--lh: 24px;
--maxw: 1296px;
--paper: #ffffff;
--ink: #111315;
--ink-soft: #5b6066;
--line: #e2e4e7;
--accent: #0057b8;
--accent-2: #009688;
--accent-3: #e8710a;
--accent-4: #7b2ff7;
--g-col: rgba(0,87,184,.06);
--g-edge: rgba(0,87,184,.38);
--g-base: rgba(0,150,140,.30);
--g-base-min: rgba(0,150,140,.10);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 16px; line-height: var(--lh); -webkit-font-smoothing: antialiased; }
.wrap { position: relative; max-width: var(--maxw); margin: 0 auto; padding: 48px var(--margin) 96px; }
.grid { position: relative; display: grid; grid-template-columns: repeat(var(--cols), 1fr); column-gap: var(--gutter); row-gap: var(--lh); align-items: start; }
.band { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; column-gap: var(--gutter); align-items: start; }
@supports not (grid-template-columns: subgrid) { .band { grid-template-columns: repeat(var(--cols), 1fr); } }
/* header */
header.masthead-band { grid-column: 1 / -1; text-align: center; border-bottom: 2px solid var(--ink); padding-bottom: 24px; margin-bottom: 8px; }
.kicker { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
.masthead { font-weight: 800; font-size: clamp(2rem, 5vw, 4rem); line-height: 1.02; letter-spacing: -0.02em; color: var(--ink); }
.subtitle { font-size: 1.05rem; line-height: var(--lh); color: var(--ink-soft); margin-top: 16px; font-weight: 400; }
/* layout */
.models-col { grid-column: 1 / 6; display: grid; gap: 24px; }
.table-col { grid-column: 6 / -1; }
/* model cards */
.model-card { background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--ink); padding: 24px; transition: border-color .2s; }
.model-card .num { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .12em; color: var(--ink-soft); text-transform: uppercase; margin-bottom: 8px; }
.model-card h2 { font-size: 1.25rem; line-height: var(--lh); font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
.model-card .equation { font-family: 'Space Mono', monospace; font-size: 0.8rem; line-height: var(--lh); background: #f4f5f6; padding: 8px 12px; margin-bottom: 16px; color: var(--ink); border-left: 3px solid var(--accent); }
.card-ts { border-top-color: var(--accent); } .card-ts h2 { color: var(--accent); } .card-ts .equation { border-left-color: var(--accent); }
.card-mor { border-top-color: var(--accent-3); } .card-mor h2 { color: var(--accent-3); } .card-mor .equation { border-left-color: var(--accent-3); }
.card-ib { border-top-color: var(--accent-4); } .card-ib h2 { color: var(--accent-4); } .card-ib .equation { border-left-color: var(--accent-4); }
label { display: block; font-size: 0.8rem; line-height: var(--lh); margin-bottom: 4px; color: var(--ink-soft); font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: .06em; }
input[type=number] { width: 100%; padding: 8px 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 1rem; margin-bottom: 16px; outline: none; transition: border-color .2s; }
input[type=number]:focus { border-color: var(--ink); }
.btn { width: 100%; padding: 12px; border: none; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; cursor: pointer; transition: opacity .2s; color: #fff; }
.btn-ts { background: var(--accent); } .btn-mor { background: var(--accent-3); } .btn-ib { background: var(--accent-4); }
.btn:hover { opacity: 0.85; }
.result { margin-top: 16px; padding: 16px; text-align: center; font-family: 'Space Mono', monospace; font-size: 1.4rem; font-weight: 700; min-height: 56px; display: flex; align-items: center; justify-content: center; background: #f4f5f6; }
.result-ts { color: var(--accent); } .result-mor { color: var(--accent-3); } .result-ib { color: var(--accent-4); }
.range-hint { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--ink-soft); margin-bottom: 16px; letter-spacing: .02em; }
/* table */
.table-card { background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--ink); padding: 24px; }
.table-card h2 { font-size: 1.25rem; line-height: var(--lh); font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
.table-card .caption { font-size: 0.85rem; line-height: var(--lh); color: var(--ink-soft); margin-bottom: 16px; }
.table-wrap { overflow-x: auto; }
table.comp { width: 100%; border-collapse: collapse; font-size: 0.78rem; line-height: 1.4; }
table.comp th, table.comp td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.comp thead th { background: var(--ink); color: #fff; font-family: 'Space Mono', monospace; font-size: 0.7rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; position: sticky; top: 0; }
table.comp tbody tr:hover { background: #f4f5f6; }
table.comp td.num { text-align: right; font-family: 'Space Mono', monospace; }
table.comp .shell { font-weight: 700; color: var(--ink); }
table.comp .sci { font-style: italic; }
table.comp a { color: var(--accent); text-decoration: none; }
table.comp a:hover { text-decoration: underline; }
.table-note { font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(--ink-soft); margin-top: 12px; line-height: 1.6; }
/* info block centered */
.info { text-align: center; font-size: 0.9rem; color: var(--ink-soft); margin-top: 48px; line-height: 1.8; grid-column: 2 / 12; padding-top: 24px; border-top: 2px solid var(--ink); }
.info strong { color: var(--ink); font-weight: 700; }
.info .devby { font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: .08em; font-size: 0.8rem; color: var(--ink); margin-top: 16px; display: block; }
/* grid overlay - same content box */
.guides { position: absolute; inset: 0; pointer-events: none; z-index: 60; opacity: 0; transition: opacity .26s ease; }
body.grid-on .guides { opacity: 1; }
.guides .cols { position: absolute; top: 0; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(var(--cols), 1fr); column-gap: var(--gutter); }
.guides .col { background: var(--g-col); box-shadow: inset 1px 0 0 var(--g-edge), inset -1px 0 0 var(--g-edge); position: relative; }
.guides .col span { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-family: 'Space Mono', monospace; font-size: 10px; line-height: 1; color: var(--accent); }
.guides .rows { position: absolute; inset: 0; background-image: repeating-linear-gradient(to bottom, var(--g-base) 0 1px, transparent 1px var(--lh)), repeating-linear-gradient(to bottom, var(--g-base-min) 0 1px, transparent 1px var(--bl)); }
.toggle { position: fixed; top: 18px; left: 18px; z-index: 200; display: flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; border: none; cursor: pointer; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; padding: 11px 14px; }
.toggle .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
body.grid-on .toggle { background: var(--accent); }
body.grid-on .toggle .dot { background: #fff; }
/* agent widget - enlarged */
#agent-fab { position: fixed; bottom: 24px; right: 24px; z-index: 9999; background: var(--ink); color: #fff; border: none; border-radius: 50%; width: 64px; height: 64px; font-family: 'Space Mono', monospace; font-size: 1.6rem; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
#agent-fab:hover { background: var(--accent); }
#agent-panel { position: fixed; bottom: 104px; right: 24px; z-index: 9999; width: 480px; max-width: calc(100vw - 48px); height: 640px; max-height: calc(100vh - 140px); background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 8px 40px rgba(0,0,0,0.2); display: none; flex-direction: column; overflow: hidden; font-family: 'Inter', sans-serif; }
#agent-panel.open { display: flex; }
#agent-head { background: var(--ink); color: #fff; padding: 16px 18px; font-size: 1.05rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
#agent-head span.sub { font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: .1em; text-transform: uppercase; opacity: 0.7; font-weight: 400; }
#agent-close { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; line-height: 1; }
#agent-log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.agent-msg { max-width: 88%; padding: 10px 14px; font-size: 0.95rem; line-height: 1.55; white-space: pre-wrap; }
.agent-msg.bot { background: #f4f5f6; color: var(--ink); align-self: flex-start; border-left: 3px solid var(--accent); }
.agent-msg.user { background: var(--ink); color: #fff; align-self: flex-end; }
.agent-msg.label { font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: .08em; text-transform: uppercase; opacity: 0.6; padding: 0; background: none; border: none; }
#agent-form { display: flex; border-top: 1px solid var(--line); }
#agent-input { flex: 1; border: none; padding: 14px; font-size: 0.95rem; font-family: 'Inter', sans-serif; outline: none; }
#agent-send { background: var(--ink); color: #fff; border: none; padding: 0 22px; cursor: pointer; font-family: 'Space Mono', monospace; font-size: 0.85rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
#agent-send:hover { background: var(--accent); }
#agent-send:disabled { opacity: 0.5; cursor: default; }
@media (max-width: 900px) { .models-col { grid-column: 1 / -1; } .table-col { grid-column: 1 / -1; } .info { grid-column: 1 / -1; } #agent-panel { width: calc(100vw - 48px); height: calc(100vh - 140px); } }
</style>
</head>
